<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ragdoll Archers - Multiplayer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: #1a1a1a;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      touch-action: none;
      user-select: none
    }

    canvas {
      display: block;
      cursor: crosshair
    }

    /* ===== SCREENS ===== */
    .scr {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(18, 18, 18, 0.97);
      z-index: 10;
      transition: opacity .3s
    }

    .scr.hidden {
      display: none !important
    }

    .title {
      font-size: clamp(28px, 6vw, 52px);
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 6px;
      text-shadow: 0 0 30px rgba(232, 160, 48, 0.4)
    }

    .sub {
      font-size: 15px;
      color: #777;
      margin-bottom: 36px
    }

    .btn {
      display: block;
      width: 260px;
      padding: 14px;
      margin: 7px 0;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s;
      text-transform: uppercase;
      letter-spacing: 2px
    }

    .btn:hover {
      transform: scale(1.04);
      filter: brightness(1.1)
    }

    .btn:active {
      transform: scale(0.97)
    }

    .bp {
      background: #e8a030;
      color: #1a1a1a
    }

    .bs {
      background: #444;
      color: #fff
    }

    .bd {
      background: #a93226;
      color: #fff
    }

    .room-code {
      font-size: clamp(32px, 8vw, 52px);
      font-weight: 900;
      color: #e8a030;
      letter-spacing: 10px;
      margin: 16px 0;
      font-family: monospace;
      cursor: pointer;
      padding: 8px 18px;
      border: 2px dashed #555;
      border-radius: 8px;
      transition: border-color .2s
    }

    .room-code:hover {
      border-color: #e8a030
    }

    .inp {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 8px;
      text-align: center;
      background: #2a2a2a;
      border: 2px solid #555;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      width: 260px;
      margin: 16px 0;
      text-transform: uppercase;
      font-family: monospace
    }

    .inp:focus {
      outline: none;
      border-color: #e8a030
    }

    .stat {
      font-size: 14px;
      color: #999;
      margin: 8px 0;
      min-height: 20px
    }

    .stat.err {
      color: #e74c3c
    }

    .stat.ok {
      color: #2ecc71
    }

    .wt::after {
      content: '';
      animation: dots 1.5s steps(4) infinite
    }

    @keyframes dots {
      0% {
        content: ''
      }

      25% {
        content: '.'
      }

      50% {
        content: '..'
      }

      75% {
        content: '...'
      }
    }

    .go-content {
      text-align: center
    }

    .win-txt {
      font-size: clamp(24px, 5vw, 40px);
      font-weight: 900;
      color: #e8a030;
      margin-bottom: 14px
    }

    .score-txt {
      font-size: 22px;
      color: #bbb;
      margin-bottom: 24px
    }

    /* ===== IN-GAME UI ===== */
    #jumpBtn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      padding: 10px 28px;
      background: rgba(50, 50, 50, 0.85);
      border: 2px solid #666;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      letter-spacing: 1px
    }

    #jumpBtn:hover {
      background: rgba(70, 70, 70, 0.9)
    }

    #jumpBtn:active {
      transform: translateX(-50%) scale(0.94)
    }

    #jumpBtn .jcost {
      font-size: 10px;
      color: #3498db;
      display: block;
      margin-top: 2px
    }

    #pauseBtn {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 5;
      width: 36px;
      height: 36px;
      background: rgba(50, 50, 50, 0.6);
      border: 1px solid #555;
      border-radius: 6px;
      color: #aaa;
      font-size: 18px;
      cursor: pointer;
      display: none
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(30, 30, 30, 0.95);
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #555;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none
    }

    .toast.show {
      opacity: 1
    }
  </style>
</head>

<body>

  <!-- ===== MAIN MENU ===== -->
  <div id="menuScr" class="scr">
    <div class="title">Ragdoll Archers</div>
    <div class="sub">Multiplayer Bow &amp; Arrow Battle</div>
    <button class="btn bp" onclick="G.createRoom()">Create Room</button>
    <button class="btn bs" onclick="G.showJoin()">Join Room</button>
    <button class="btn bs" onclick="G.startBot()">Play vs Bot</button>
  </div>

  <!-- ===== LOBBY ===== -->
  <div id="lobbyScr" class="scr hidden">
    <div class="sub">Share this code with your friend</div>
    <div class="room-code" id="roomCode" onclick="G.copyCode()" title="Click to copy">-----</div>
    <div class="stat" id="lobbyStat"><span class="wt">Connecting</span></div>
    <button class="btn bd" onclick="G.cancel()" style="margin-top:16px">Cancel</button>
  </div>

  <!-- ===== JOIN ===== -->
  <div id="joinScr" class="scr hidden">
    <div class="sub">Enter your friend's room code</div>
    <input type="text" class="inp" id="joinInp" maxlength="5" placeholder="XXXXX" autocomplete="off" spellcheck="false">
    <div class="stat" id="joinStat"></div>
    <button class="btn bp" onclick="G.joinRoom()">Join</button>
    <button class="btn bs" onclick="G.showMenu()" style="margin-top:8px">Back</button>
  </div>

  <!-- ===== GAME OVER ===== -->
  <div id="goScr" class="scr hidden">
    <div class="go-content">
      <div class="win-txt" id="winTxt">Player 1 Wins!</div>
      <div class="score-txt" id="scoreTxt">0 - 0</div>
      <button class="btn bp" onclick="G.nextRound()">Next Round</button>
      <button class="btn bs" onclick="G.backMenu()" style="margin-top:8px">Main Menu</button>
    </div>
  </div>

  <canvas id="cv"></canvas>
  <button id="jumpBtn" onclick="G.doJump()">JUMP<span class="jcost">20 STAMINA</span></button>
  <button id="pauseBtn" onclick="G.togglePause()">⏸</button>
  <div class="toast" id="toast"></div>

  <!-- WebSocket networking handled by server.js -->
  <script>
    // ================================================================
    //  RAGDOLL ARCHERS — Complete Game
    // ================================================================

    // ===== CONFIGURATION =====
    const C = {
      W: 1000, H: 600,
      GRAVITY: 0.35,
      // Arrow
      ARR_GRAV: 0.13,
      ARR_MAX_V: 13,
      ARR_DMG_MIN: 12,
      ARR_DMG_MAX: 38,
      ARR_HS_MULT: 1.8,
      // Gameplay
      MAX_HP: 100,
      MAX_ST: 100,
      SHOOT_COST: 12,
      JUMP_COST: 20,
      JUMP_VY: -7.5,
      ST_REGEN: 0.1,
      SHOOT_CD: 45,
      // Colors
      BG: '#3a3a3a',
      STK: '#f0f0f0',
      BOW: '#e8a030',
      FLETCH: '#e74c3c',
    };

    // ===== GLOBALS =====
    let cv, ctx, scale = 1, offX = 0, offY = 0;
    let leftPlat = { x: 55, y: 305, w: 165, h: 310 };
    let rightPlat = { x: 775, y: 365, w: 165, h: 250 };
    let gameState = 'menu'; // menu | creating | joining | playing | roundOver
    let myIdx = 0; // 0=left, 1=right
    let players = [null, null];
    let arrows = [];
    let particles = [];
    let apple = null;
    let stars = [];
    let scores = [0, 0];
    let roundTimer = 0;
    let shake = 0;
    let paused = false;
    let mouseVX = 500, mouseVY = 300;
    let mouseDown = false;
    let aimSyncTick = 0;
    let appleRespawn = 0;
    let ambientTick = 0;
    let bloodStains = [];
    let severedParts = [];
    let hsFlash = 0; // headshot flash

    // Network
    let ws = null, isHost = false, isBotGame = false;
    let roomCode = '';

    // ===== UTILITIES =====
    const dist = (x1, y1, x2, y2) => Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
    const lerp = (a, b, t) => a + (b - a) * t;
    const lerpAngle = (a, b, t) => {
      let diff = b - a;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      return a + diff * t;
    };
    const rand = (a, b) => a + Math.random() * (b - a);
    const randInt = (a, b) => Math.floor(rand(a, b + 1));
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    function genCode() {
      const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let s = '';
      for (let i = 0; i < 5; i++) s += ch[Math.floor(Math.random() * ch.length)];
      return s;
    }

    // ===== STARS =====
    function genStars() {
      stars = [];
      for (let i = 0; i < 90; i++) {
        stars.push({
          x: Math.random() * C.W,
          y: Math.random() * C.H,
          r: 0.5 + Math.random() * 1.5,
          a: 0.2 + Math.random() * 0.5,
        });
      }
    }

    // ===== PARTICLE =====
    class Particle {
      constructor(x, y, vx, vy, color, size, life, grav) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.size = size;
        this.life = life; this.maxLife = life; this.alive = true;
        this.grav = grav || 0.08;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += this.grav; this.vx *= 0.97;
        if (--this.life <= 0) this.alive = false;
      }
    }

    // ===== BLOOD SYSTEM =====
    class BloodStain {
      constructor(x, y, size) {
        this.x = x; this.y = y; this.size = size;
        this.alpha = 0.6 + Math.random() * 0.3;
        this.color = Math.random() > 0.5 ? '#8b0000' : '#a31515';
      }
    }

    const BLOOD_COLORS = ['#8b0000', '#a31515', '#c0392b', '#e74c3c', '#7a1a1a', '#660000'];
    function pickBlood() { return BLOOD_COLORS[Math.floor(Math.random() * BLOOD_COLORS.length)]; }

    function spawnBlood(x, y, avx, avy, count, headshot) {
      const sp = Math.sqrt(avx * avx + avy * avy) || 1;
      const nx = avx / sp, ny = avy / sp;
      const mult = headshot ? 1.8 : 1;
      for (let i = 0; i < count; i++) {
        // Directional spray in arrow direction
        const spread = headshot ? 2.2 : 1.4;
        const vx = nx * (1 + Math.random() * 5) * mult + (Math.random() - 0.5) * spread * 3;
        const vy = ny * (1 + Math.random() * 5) * mult + (Math.random() - 0.5) * spread * 3 - Math.random() * 2;
        const sz = headshot ? 2 + Math.random() * 4 : 1.5 + Math.random() * 3;
        const life = 25 + randInt(0, 30);
        particles.push(new Particle(x, y, vx, vy, pickBlood(), sz, life, 0.12));
      }
      // Blood drips (slower, heavier)
      for (let i = 0; i < (headshot ? 6 : 3); i++) {
        const vx = (Math.random() - 0.5) * 1.5;
        const vy = 1 + Math.random() * 2;
        particles.push(new Particle(x, y, vx, vy, pickBlood(), 2 + Math.random() * 2, 50 + randInt(0, 30), 0.18));
      }
      // Add blood stain at impact point
      bloodStains.push(new BloodStain(x, y, 3 + Math.random() * 5 * (headshot ? 2 : 1)));
    }

    function spawnDeathBlood(x, y) {
      // Big blood pool on death
      for (let i = 0; i < 6; i++) {
        bloodStains.push(new BloodStain(x + rand(-12, 12), y + rand(-5, 5), 5 + Math.random() * 8));
      }
      // Blood explosion
      for (let i = 0; i < 25; i++) {
        const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
        particles.push(new Particle(x, y, Math.cos(a) * s, Math.sin(a) * s, pickBlood(), 2 + Math.random() * 4, 30 + randInt(0, 25), 0.14));
      }
    }

    function spawnHit(x, y) {
      // Small white impact sparks
      for (let i = 0; i < 6; i++) {
        const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4;
        particles.push(new Particle(x, y, Math.cos(a) * s, Math.sin(a) * s,
          '#fff', 1 + Math.random() * 2, 10 + randInt(0, 10)));
      }
    }
    function spawnHeal(x, y) {
      for (let i = 0; i < 10; i++) {
        const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
        particles.push(new Particle(x, y, Math.cos(a) * s, Math.sin(a) * s,
          '#2ecc71', 2 + Math.random() * 2, 20 + randInt(0, 15)));
      }
    }

    function drawBloodStains() {
      for (const b of bloodStains) {
        ctx.globalAlpha = b.alpha;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, 6.28);
        ctx.fillStyle = b.color; ctx.fill();
        // Splatter detail
        if (b.size > 4) {
          for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(b.x + rand(-b.size, b.size), b.y + rand(-b.size * 0.5, b.size * 0.5),
              b.size * 0.3 + Math.random() * b.size * 0.3, 0, 6.28);
            ctx.fill();
          }
        }
      }
      ctx.globalAlpha = 1;
    }

    // ===== DISMEMBERMENT =====
    const LIMB_MAP = {
      'head': 'head',
      'elbowF': 'armF', 'handF': 'armF',
      'elbowB': 'armB', 'handB': 'armB',
      'kneeF': 'legF', 'footF': 'legF',
      'kneeB': 'legB', 'footB': 'legB',
      'shoulder': null, 'hip': null,
    };

    class SeveredPart {
      constructor(x, y, vx, vy, type, headR, helmetType) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.type = type; this.headR = headR || 13;
        this.helmetType = helmetType || 0;
        this.angle = Math.random() * 6.28;
        this.spin = (Math.random() - 0.5) * 0.35;
        this.life = 220; this.alive = true;
        this.len = type === 'head' ? 0 : (type.startsWith('arm') ? 18 : 22);
      }
      update() {
        this.vy += 0.28; this.x += this.vx; this.y += this.vy;
        this.vx *= 0.995; this.angle += this.spin; this.spin *= 0.985;
        // Floor
        if (this.y > C.H - 6) { this.y = C.H - 6; this.vy *= -0.25; this.vx *= 0.6; this.spin *= 0.4; }
        // Platform tops
        for (const pl of [leftPlat, rightPlat]) {
          if (this.x >= pl.x && this.x <= pl.x + pl.w && this.y >= pl.y - 4 && this.y <= pl.y + 10) {
            this.y = pl.y - 4; this.vy *= -0.2; this.vx *= 0.5; this.spin *= 0.3;
          }
        }
        // Blood trail
        if (this.life > 80 && this.life % 3 === 0) {
          particles.push(new Particle(this.x, this.y, rand(-0.5, 0.5), rand(-0.5, 1), pickBlood(), 1.5 + Math.random() * 2, 18 + randInt(0, 12), 0.14));
          if (Math.random() < 0.3) bloodStains.push(new BloodStain(this.x + rand(-4, 4), this.y + rand(-2, 4), 2 + Math.random() * 3));
        }
        if (--this.life <= 0) this.alive = false;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y); ctx.rotate(this.angle);
        ctx.strokeStyle = C.STK; ctx.fillStyle = C.STK; ctx.lineCap = 'round';
        if (this.type === 'head') {
          ctx.beginPath(); ctx.arc(0, 0, this.headR, 0, 6.28); ctx.fill();
          drawHelmet(0, 0, 0, this.helmetType, this.headR);
          // Blood drip from neck stump
          ctx.beginPath(); ctx.arc(0, this.headR, 4, 0, Math.PI);
          ctx.fillStyle = '#8b0000'; ctx.fill();
        } else {
          const w = this.type.startsWith('arm') ? 3.5 : 4.5;
          ctx.lineWidth = w;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(this.len, 0); ctx.stroke();
          // Joint balls
          ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, 6.28); ctx.fill();
          ctx.beginPath(); ctx.arc(this.len, 0, 2, 0, 6.28); ctx.fill();
          // Blood stump
          ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, 6.28);
          ctx.fillStyle = '#8b0000'; ctx.fill();
        }
        ctx.restore();
      }
    }

    function severLimb(sm, limbGroup, arrVX, arrVY, hitX, hitY) {
      if (sm.severed.has(limbGroup)) return;
      sm.severed.add(limbGroup);
      // Launch velocity from arrow impact
      const sp = Math.sqrt(arrVX * arrVX + arrVY * arrVY) || 1;
      const lvx = (arrVX / sp) * 4 + rand(-2, 2);
      const lvy = (arrVY / sp) * 3 - 3 + rand(-2, 0);
      const part = new SeveredPart(hitX, hitY, lvx, lvy, limbGroup, sm.headR, sm.helmetType);
      severedParts.push(part);
      // Add stump bleed point
      const j = sm.getJoints();
      let stumpPt;
      switch (limbGroup) {
        case 'head': stumpPt = 'shoulder'; break;
        case 'armF': stumpPt = 'shoulder'; break;
        case 'armB': stumpPt = 'shoulder'; break;
        case 'legF': stumpPt = 'hip'; break;
        case 'legB': stumpPt = 'hip'; break;
      }
      if (stumpPt && j[stumpPt]) sm.stumps.push({ joint: stumpPt, life: 150 });
      // Extra blood burst
      spawnBlood(hitX, hitY, arrVX, arrVY, 18, true);

      // === HEAD SEVERED = INSTANT DEATH ===
      if (limbGroup === 'head') {
        // Massive blood fountain from neck
        for (let i = 0; i < 40; i++) {
          particles.push(new Particle(j.shoulder.x, j.shoulder.y, rand(-2, 2), rand(-8, -2), pickBlood(), 2 + Math.random() * 4, 40 + randInt(0, 30), 0.13));
        }
        sm.hp = 0;
        spawnDeathBlood(hitX, hitY);
        sm.die(arrVX, arrVY);
        hsFlash = 15; shake = 15;
        return;
      }
      // === LEG SEVERED = FALL DOWN ===
      if (limbGroup === 'legF' || limbGroup === 'legB') {
        if (!sm.fallen) {
          sm.fallen = true;
          sm.kbVX = (arrVX || 0) * 0.4;
        }
      }
      // === BOW ARM GONE = can't shoot (cancel aim) ===
      if (limbGroup === 'armF') {
        sm.isAim = false; sm.aimPow = 0;
      }
    }

    // ===== APPLE =====
    class Apple {
      constructor() {
        this.x = C.W / 2 + rand(-80, 80);
        this.y = C.H * 0.54 + rand(-30, 30);
        this.baseY = this.y;
        this.ph = Math.random() * Math.PI * 2;
        this.alive = true;
        this.r = 10;
      }
      update() {
        this.ph += 0.03;
        this.y = this.baseY + Math.sin(this.ph) * 6;
      }
    }

    // ===== ARROW =====
    class Arrow {
      constructor(x, y, angle, power, shooterIdx, type) {
        this.x = x; this.y = y; this.angle = angle;
        this.vx = Math.cos(angle) * power * C.ARR_MAX_V;
        this.vy = Math.sin(angle) * power * C.ARR_MAX_V;
        this.shooterIdx = shooterIdx;
        this.type = type || 0; // 0=Normal, 1=Fire, 2=Blade
        this.alive = true;
        this.stuck = false;
        this.stuckTo = null;
        this.stuckJoint = '';
        this.stuckOff = { x: 0, y: 0 };
        let dmgMult = this.type === 2 ? 1.6 : 1; // Blade does 60% more damage
        this.damage = (C.ARR_DMG_MIN + (C.ARR_DMG_MAX - C.ARR_DMG_MIN) * power) * dmgMult;
        this.age = 0;
        this.hasHit = false;
      }
      update() {
        this.age++;
        if (this.stuck) {
          if (this.stuckTo) {
            let jt;
            if (this.stuckTo.alive) {
              jt = this.stuckTo.getJoints()[this.stuckJoint];
            } else if (this.stuckTo.ragdoll) {
              const rp = this.stuckTo.ragdoll.pts[this.stuckJoint];
              if (rp) jt = { x: rp.x, y: rp.y };
            }
            if (jt) { this.x = jt.x + this.stuckOff.x; this.y = jt.y + this.stuckOff.y; }
          }
          return;
        }
        this.vy += C.ARR_GRAV;
        this.x += this.vx; this.y += this.vy;
        this.angle = Math.atan2(this.vy, this.vx);

        // Fire arrow trail
        if (this.type === 1 && this.age % 2 === 0) {
          particles.push(new Particle(this.x, this.y, rand(-0.5, 0.5), rand(-1, 0),
            Math.random() > 0.5 ? '#e67e22' : '#e74c3c', 2 + Math.random() * 2, 10 + randInt(0, 10), -0.05));
        }

        // Out of bounds
        if (this.x < -120 || this.x > C.W + 120 || this.y > C.H + 120 || this.y < -250) { this.alive = false; return; }

        // Platform collision
        const tx = this.x + Math.cos(this.angle) * 14;
        const ty = this.y + Math.sin(this.angle) * 14;
        for (const p of [leftPlat, rightPlat]) {
          if (tx >= p.x && tx <= p.x + p.w && ty >= p.y && ty <= p.y + p.h) {
            this.stuck = true; this.stuckTo = null; return;
          }
        }
      }
      stickTo(sm, jname) {
        this.stuck = true; this.stuckTo = sm; this.stuckJoint = jname; this.hasHit = true;
        const j = sm.getJoints()[jname];
        if (j) { this.stuckOff.x = this.x - j.x; this.stuckOff.y = this.y - j.y; }
      }
    }

    // ===== VERLET RAGDOLL =====
    class VRagdoll {
      constructor(joints, headR, severed, helmetType) {
        this.headR = headR;
        this.severed = severed || new Set();
        this.helmetType = helmetType || 0;
        this.pts = {};
        for (const [n, p] of Object.entries(joints)) {
          this.pts[n] = { x: p.x, y: p.y, ox: p.x, oy: p.y };
        }
        this.cons = [];
        const add = (a, b) => {
          const pa = this.pts[a], pb = this.pts[b];
          if (!pa || !pb) return;
          const d = dist(pa.x, pa.y, pb.x, pb.y) || 1;
          this.cons.push({ a: pa, b: pb, len: d });
        };
        add('head', 'shoulder'); add('shoulder', 'hip');
        add('shoulder', 'elbowF'); add('elbowF', 'handF');
        add('shoulder', 'elbowB'); add('elbowB', 'handB');
        add('hip', 'kneeF'); add('kneeF', 'footF');
        add('hip', 'kneeB'); add('kneeB', 'footB');
        add('head', 'hip'); // structural
      }
      impulse(x, y, vx, vy) {
        for (const p of Object.values(this.pts)) {
          const d = dist(p.x, p.y, x, y) || 1;
          const f = Math.max(0, 1 - d / 90);
          p.ox -= vx * f; p.oy -= vy * f;
        }
      }
      update() {
        for (const p of Object.values(this.pts)) {
          const vx = (p.x - p.ox) * 0.97, vy = (p.y - p.oy) * 0.97;
          p.ox = p.x; p.oy = p.y;
          p.x += vx; p.y += vy + 0.32;
        }
        for (let it = 0; it < 4; it++) {
          for (const c of this.cons) {
            const dx = c.b.x - c.a.x, dy = c.b.y - c.a.y;
            const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
            const diff = (c.len - d) / d * 0.5;
            c.a.x -= dx * diff; c.a.y -= dy * diff;
            c.b.x += dx * diff; c.b.y += dy * diff;
          }
          this.constrain();
        }
      }
      constrain() {
        for (const p of Object.values(this.pts)) {
          if (p.y > C.H + 250) continue;
          if (p.y > C.H - 4) { p.y = C.H - 4; const vx = p.x - p.ox; p.ox = p.x - vx * 0.75; }
          for (const pl of [leftPlat, rightPlat]) {
            if (p.x >= pl.x && p.x <= pl.x + pl.w && p.y >= pl.y - 2 && p.y <= pl.y + 12) {
              p.y = pl.y - 2; const vx = p.x - p.ox; p.ox = p.x - vx * 0.7;
            }
          }
        }
      }
    }

// ===== INPUT =====
    const keys = { a: false, d: false, w: false, s: false, space: false };
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (keys.hasOwnProperty(k)) keys[k] = true;
      if (e.code === 'Space') keys.space = true;
    });
    window.addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      if (keys.hasOwnProperty(k)) keys[k] = false;
      if (e.code === 'Space') keys.space = false;
    });

    // ===== STICKMAN =====
    class Stickman {
      constructor(x, platY, facing, idx) {
        this.x = x;
        this.basePlatY = platY;
        this.platY = platY;
        this.y = platY;
        this.vx = 0;
        this.vy = 0;
        this.facing = facing;
        this.idx = idx;
        this.hp = C.MAX_HP;
        this.st = C.MAX_ST;
        this.alive = true;
        this.onGround = true;
        this.isAim = false;
        this.aimA = facing > 0 ? 0 : Math.PI;
        this.aimPow = 0;
        this.cd = 0;
        this.stgT = 0;
        this.stgD = 0;
        this.kbVX = 0;
        this.breath = Math.random() * 6;
        this.ragdoll = null;
        this.headR = 17.5; // Was 13 (scaled by 1.35x)
        this.severed = new Set(); // which limb groups are cut off
        this.stumps = []; // bleeding stump positions
        this.helmetType = randInt(1, 3);
        this.arrowType = 0; // 0=Normal, 1=Fire, 2=Blade
        this.burnT = 0; // burn timer
        this.stun = 0;
        this.flinch = 0;
        this.slow = 0;
        this.crouch = false;
      }

      update() {
        if (!this.alive) {
          if (this.ragdoll) this.ragdoll.update();
          return;
        }

        // Input handling for local player
        if (this.idx === myIdx && gameState === 'playing') {
          let walkVx = 0;
          if (keys.a) walkVx -= 2.2;
          if (keys.d) walkVx += 2.2;
          
          if (this.stun > 0 || this.flinch > 0) walkVx = 0;
          if (this.slow > 0) walkVx *= 0.5;
          if (this.isAim) walkVx *= 0.4;
          if (this.fallen) walkVx = 0;
          
          this.vx = walkVx;
          
          if (keys.space && this.onGround && this.st >= C.JUMP_COST && this.stun <= 0 && !this.fallen) {
            this.jump();
            keys.space = false; // require re-press
          }
          
          this.crouch = keys.s && !keys.w;
        }

        // Apply crouch
        let targetPlatY = this.basePlatY;
        if (this.crouch) targetPlatY += 22; // lower down
        this.platY += (targetPlatY - this.platY) * 0.2;

        // Apply horizontal velocity and constrain to platform
        this.x += this.vx;
        const pl = this.idx === 0 ? leftPlat : rightPlat;
        if (pl) {
          if (this.x < pl.x + 12) this.x = pl.x + 12;
          if (this.x > pl.x + pl.w - 12) this.x = pl.x + pl.w - 12;
        }

        // Status effects
        if (this.stun > 0) {
          this.stun--;
          this.isAim = false;
          this.aimPow = 0;
        }
        if (this.flinch > 0) {
          this.flinch--;
          this.isAim = false;
          this.aimPow = 0;
        }
        if (this.slow > 0) {
          this.slow--;
        }

        if (!this.onGround) {
          this.vy += C.GRAVITY; this.y += this.vy;
          if (this.y >= this.platY) { this.y = this.platY; this.vy = 0; this.onGround = true; }
        }
        this.st = Math.min(C.MAX_ST, this.st + C.ST_REGEN);
        // Stump bleeding
        for (let i = this.stumps.length - 1; i >= 0; i--) {
          const s = this.stumps[i];
          s.life--;
          if (s.life <= 0) { this.stumps.splice(i, 1); continue; }
          const j2 = this.getJoints();
          const pt = j2[s.joint];
          if (pt && s.life % 2 === 0) {
            particles.push(new Particle(pt.x, pt.y, rand(-1, 1), rand(-4, -1), pickBlood(), 2 + Math.random() * 2, 15 + randInt(0, 10), 0.15));
            if (s.life % 6 === 0) bloodStains.push(new BloodStain(pt.x + rand(-3, 3), pt.y + rand(0, 8), 2 + Math.random() * 3));
          }
        }
        // Burn DoT
        if (this.burnT > 0) {
          this.burnT--;
          if (this.burnT % 8 === 0) {
            this.hp -= 1;
            if (this.hp <= 0) { spawnDeathBlood(this.x, this.y); this.die(0, 0); }
          }
          if (this.burnT % 2 === 0) {
            const j = this.getJoints();
            particles.push(new Particle(j.shoulder.x + rand(-10, 10), j.shoulder.y + rand(-15, 15),
              rand(-1, 1), rand(-2, -0.5), Math.random() > 0.5 ? '#e67e22' : '#e74c3c', 2 + Math.random() * 3, 15 + randInt(0, 10), -0.08));
          }
        }
        if (this.cd > 0) this.cd--;
        if (this.isAim) this.aimPow = Math.min(1, this.aimPow + 0.014);
        this.breath += 0.04;
        if (this.stgT > 0) { this.stgT -= 0.025; if (this.stgT < 0) this.stgT = 0; }
        if (Math.abs(this.kbVX) > 0.08) {
          this.x += this.kbVX; this.kbVX *= 0.84;
          const pl = this.idx === 0 ? leftPlat : rightPlat;
          this.x = clamp(this.x, pl.x + 18, pl.x + pl.w - 18);
        }
      }

      getJoints() {
        const s = 1.35; // Scale factor
        
        // Update facing if aiming
        if (this.isAim) this.facing = Math.cos(this.aimA) >= 0 ? 1 : -1;
        
        let targetAngle = 0;
        let targetHyOffset = 45 * s;
        if (this.fallen) {
           targetAngle = -(Math.PI / 2.2) * this.facing;
           targetHyOffset = 18 * s;
        }
        
        if (this.fallAngle === undefined) { this.fallAngle = 0; this.hyOffset = 45 * s; }
        this.fallAngle += (targetAngle - this.fallAngle) * 0.15;
        this.hyOffset += (targetHyOffset - this.hyOffset) * 0.15;
        
        const stgOff = this.stgT > 0 ? Math.sin(this.stgT * Math.PI) * (12 * s) * this.stgD : 0;
        let hy = this.y - this.hyOffset + Math.sin(this.breath) * (2 * s);
        
        // Calculate head shake if stunned
        let headXOff = 0, headYOff = 0;
        if (this.stun > 0) {
          headXOff = (Math.random() - 0.5) * (6 * s);
          headYOff = (Math.random() - 0.5) * (6 * s);
        }

        const f = this.facing;
        const br = Math.sin(this.breath) * (1.2 * s);
        const lean = this.stgT > 0 ? Math.sin(this.stgT * 12) * this.stgD * (5 * s) * this.stgT : 0;
        const hx = this.x, hsy = hy + (19 * s);
        const sx = hx + lean * 0.6, sy = hsy - (28 * s) + br;
        const hdx = sx + lean * 0.4 + headXOff, hdy = sy - (8 * s) - this.headR + headYOff;
        // legs
        const kfx = hx + (5 * s) * f, kfy = hy + (14 * s), ffx = hx + (7 * s) * f, ffy = this.y;
        const kbx = hx - (3 * s) * f, kby = hy + (14 * s), fbx = hx - (5 * s) * f, fby = this.y;
        // arms
        let efx, efy, hfx, hfy, ebx, eby, hbx, hby;
        const aiming = this.isAim || this.cd > C.SHOOT_CD - 8;
        if (aiming) {
          const al = 28 * s;
          hfx = sx + Math.cos(this.aimA) * al; hfy = sy + Math.sin(this.aimA) * al;
          const mx = (sx + hfx) / 2, my = (sy + hfy) / 2;
          const px = -(hfy - sy) * 0.15, py = (hfx - sx) * 0.15;
          efx = mx + px; efy = my + py;
          const pd = this.isAim ? this.aimPow * (14 * s) + (4 * s) : 4 * s;
          hbx = hfx - Math.cos(this.aimA) * pd; hby = hfy - Math.sin(this.aimA) * pd;
          ebx = (sx + hbx) / 2 - px * 0.4; eby = (sy + hby) / 2 - py * 0.4;
        } else {
          hfx = sx + (18 * s) * f; hfy = sy + (16 * s);
          efx = sx + (10 * s) * f; efy = sy + (9 * s);
          hbx = sx - (10 * s) * f; hby = sy + (13 * s);
          ebx = sx - (6 * s) * f; eby = sy + (6 * s);
        }
        let jObj = {
          head: { x: hdx, y: hdy }, shoulder: { x: sx, y: sy }, hip: { x: hx, y: hy },
          elbowF: { x: efx, y: efy }, handF: { x: hfx, y: hfy },
          elbowB: { x: ebx, y: eby }, handB: { x: hbx, y: hby },
          kneeF: { x: kfx, y: kfy }, footF: { x: ffx, y: ffy },
          kneeB: { x: kbx, y: kby }, footB: { x: fbx, y: fby },
        };

        if (Math.abs(this.fallAngle) > 0.05) {
          const cos = Math.cos(this.fallAngle);
          const sin = Math.sin(this.fallAngle);
          for (let key in jObj) {
            if (key === 'hip') continue;
            let pt = jObj[key];
            let dx = pt.x - hx;
            let dy = pt.y - hy;
            pt.x = hx + dx * cos - dy * sin;
            pt.y = hy + dx * sin + dy * cos;
          }
        }
        return jObj;
      }

      jump() {
        if (!this.alive || !this.onGround || this.st < C.JUMP_COST || this.fallen) return false;
        this.vy = C.JUMP_VY; this.onGround = false; this.st -= C.JUMP_COST;
        return true;
      }

      stagger(vx) {
        this.stgT = 1; this.stgD = Math.sign(vx) || this.facing;
        this.kbVX = vx * 0.25;
      }

      die(avx, avy) {
        this.alive = false;
        const j = this.getJoints();
        this.ragdoll = new VRagdoll(j, this.headR, this.severed, this.helmetType);
        const sp = Math.sqrt(avx * avx + avy * avy) || 1;
        this.ragdoll.impulse(j.shoulder.x, j.shoulder.y, (avx / sp) * 7, (avy / sp) * 7);
      }
    }

    // ===== HIT DETECTION =====
    function checkHit(arr, sm) {
      if (!sm.alive || arr.stuck || arr.hasHit) return null;
      const tx = arr.x + Math.cos(arr.angle) * 29;
      const ty = arr.y + Math.sin(arr.angle) * 29;
      const j = sm.getJoints();
      
      const checkPt = (name, x, y, r) => {
        if (dist(tx, ty, x, y) < r) return { joint: name, headshot: false, x, y };
        return null;
      };
      const mid = (p1, p2) => ({ x: (p1.x + p2.x)/2, y: (p1.y + p2.y)/2 });
      
      // Head (headshot)
      if (dist(tx, ty, j.head.x, j.head.y) < sm.headR + 5.5)
        return { joint: 'head', headshot: true, x: j.head.x, y: j.head.y };
        
      let res;
      // Torso
      if (res = checkPt('shoulder', j.shoulder.x, j.shoulder.y, 12)) return res;
      if (res = checkPt('hip', j.hip.x, j.hip.y, 12)) return res;
      if (res = checkPt('shoulder', (j.shoulder.x + j.hip.x)/2, (j.shoulder.y + j.hip.y)/2, 12)) return res;

      // Limbs
      const limbs = [
        ['kneeF', j.hip, j.kneeF, 9.5], ['footF', j.kneeF, j.footF, 9.5],
        ['kneeB', j.hip, j.kneeB, 9.5], ['footB', j.kneeB, j.footB, 9.5],
        ['elbowF', j.shoulder, j.elbowF, 9.5], ['handF', j.elbowF, j.handF, 9.5],
        ['elbowB', j.shoulder, j.elbowB, 9.5], ['handB', j.elbowB, j.handB, 9.5]
      ];
      for (const [name, p1, p2, r] of limbs) {
        if (res = checkPt(name, p2.x, p2.y, r)) return res;
        const m = mid(p1, p2);
        if (res = checkPt(name, m.x, m.y, r)) return res;
      }
      return null;
    }

    // ===== RENDERING =====
    function drawStars() {
      for (const s of stars) {
        ctx.globalAlpha = s.a;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28);
        ctx.fillStyle = '#888'; ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawPlatform(pl, idx) {
      const sm = players[idx];
      // Body
      ctx.fillStyle = '#4a4a4a';
      ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
      // Bricks
      ctx.strokeStyle = '#393939'; ctx.lineWidth = 1;
      const bh = 17;
      for (let r = 0; r < Math.ceil(pl.h / bh); r++) {
        const by = pl.y + r * bh;
        if (by > pl.y + pl.h) break;
        ctx.beginPath(); ctx.moveTo(pl.x, by); ctx.lineTo(pl.x + pl.w, by); ctx.stroke();
        const off = (r % 2) * 22;
        for (let c = 1; c < 4; c++) {
          const bx = pl.x + c * (pl.w / 3.5) + off;
          if (bx > pl.x && bx < pl.x + pl.w) {
            ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, Math.min(by + bh, pl.y + pl.h)); ctx.stroke();
          }
        }
      }
      // Top edge
      ctx.fillStyle = '#585858'; ctx.fillRect(pl.x, pl.y, pl.w, 5);
      // Border
      ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.strokeRect(pl.x, pl.y, pl.w, pl.h);

      if (!sm) return;
      // UI bars on platform face
      const ux = pl.x + 14, barW = pl.w - 28, barH = 17;
      const uy = pl.y + pl.h - 95;
      // HP
      ctx.fillStyle = '#5a1a1a'; ctx.fillRect(ux, uy, barW, barH);
      ctx.fillStyle = '#e74c3c'; ctx.fillRect(ux, uy, barW * (sm.hp / C.MAX_HP), barH);
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.strokeRect(ux, uy, barW, barH);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(sm.hp), ux + barW / 2, uy + 13);
      // Stamina
      const sy2 = uy + barH + 4;
      ctx.fillStyle = '#0f2a4a'; ctx.fillRect(ux, sy2, barW, barH);
      ctx.fillStyle = '#3498db'; ctx.fillRect(ux, sy2, barW * (sm.st / C.MAX_ST), barH);
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.strokeRect(ux, sy2, barW, barH);
      ctx.fillStyle = '#fff'; ctx.fillText(Math.ceil(sm.st), ux + barW / 2, sy2 + 13);
      // Jump label
      const jy = sy2 + barH + 5;
      ctx.fillStyle = '#3e3e3e'; ctx.fillRect(ux, jy, barW, 28);
      ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.strokeRect(ux, jy, barW, 28);
      ctx.fillStyle = '#ddd'; ctx.font = 'bold 11px sans-serif';
      ctx.fillText('JUMP', ux + barW / 2, jy + 13);
      ctx.fillStyle = '#3498db'; ctx.font = '8px sans-serif';
      ctx.fillText(C.JUMP_COST + ' STAMINA', ux + barW / 2, jy + 23);
    }

    function drawHelmet(x, y, angle, type, r) {
      if (type === 0) return;
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
      ctx.fillStyle = '#888'; ctx.strokeStyle = '#555'; ctx.lineJoin = 'round';
      if (type === 1) {
        // Iron Pot
        ctx.beginPath(); ctx.rect(-r - 2, -r - 4, r * 2 + 4, r + 4); ctx.fill(); ctx.stroke();
      } else if (type === 2) {
        // Knight
        ctx.fillStyle = '#a0a0a0';
        ctx.beginPath(); ctx.arc(0, 0, r + 3, Math.PI, 0); ctx.lineTo(r + 3, r + 2); ctx.lineTo(-r - 3, r + 2); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#333'; ctx.fillRect(-r - 3, -2, r * 2 + 6, 4); // Visor slit
      } else if (type === 3) {
        // Spartan
        ctx.fillStyle = '#f1c40f'; ctx.strokeStyle = '#d35400';
        ctx.beginPath(); ctx.arc(0, 0, r + 2, Math.PI, 0); ctx.lineTo(r + 2, r + 4); ctx.lineTo(-r - 2, r + 4); ctx.closePath(); ctx.fill(); ctx.stroke();
        // Crest
        ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(0, -r - 2, r + 4, Math.PI, 0); ctx.fill();
        // Face slit
        ctx.fillStyle = '#333'; ctx.fillRect(0, -2, r + 2, 8);
      }
      ctx.restore();
    }

    function drawTorso(sx, sy, hx, hy) {
      const s = 1.35;
      ctx.lineWidth = 14; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();
      
      const dx = hx - sx, dy = hy - sy;
      const tLen = Math.sqrt(dx*dx + dy*dy) || 1;
      const nx = dx/tLen, ny = dy/tLen;
      
      ctx.fillStyle = 'rgba(200,200,200,0.5)'; // abs color
      // Pecs
      ctx.beginPath(); ctx.arc(sx + nx*6 - ny*3.5, sy + ny*6 + nx*3.5, 3, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(sx + nx*6 + ny*3.5, sy + ny*6 - nx*3.5, 3, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(sx + nx*(6 * s) - ny*(3.5 * s), sy + ny*(6 * s) + nx*(3.5 * s), 3 * s, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(sx + nx*(6 * s) + ny*(3.5 * s), sy + ny*(6 * s) - nx*(3.5 * s), 3 * s, 0, 6.28); ctx.fill();
      // Abs
      for(let i=1; i<=3; i++){
         ctx.beginPath(); ctx.arc(sx + nx*((8+i*5) * s) - ny*(2.5 * s), sy + ny*((8+i*5) * s) + nx*(2.5 * s), 2.5 * s, 0, 6.28); ctx.fill();
         ctx.beginPath(); ctx.arc(sx + nx*((8+i*5) * s) + ny*(2.5 * s), sy + ny*((8+i*5) * s) - nx*(2.5 * s), 2.5 * s, 0, 6.28); ctx.fill();
      }
    }

    function drawBow(hx, hy, aimA, isAim, pow) {
      const s = 1.35;
      ctx.save();
      ctx.translate(hx, hy);
      ctx.rotate(aimA);
      const hl = 22 * s, bCurve = 9 * s;
      // Bow body
      ctx.beginPath();
      ctx.moveTo(0, -hl);
      ctx.quadraticCurveTo(bCurve, -hl * 0.3, bCurve, 0);
      ctx.quadraticCurveTo(bCurve, hl * 0.3, 0, hl);
      ctx.strokeStyle = C.BOW; ctx.lineWidth = 4.5 * s; ctx.lineCap = 'round'; ctx.stroke();
      // Bow tips (small knobs)
      ctx.beginPath(); ctx.arc(0, -hl, 2.5 * s, 0, 6.28); ctx.arc(0, hl, 2.5 * s, 0, 6.28);
      ctx.fillStyle = C.BOW; ctx.fill();
      // String
      const pd = isAim ? pow * 18 * s + 4 * s : 1.5 * s;
      ctx.beginPath(); ctx.moveTo(0, -hl); ctx.lineTo(-pd, 0); ctx.lineTo(0, hl);
      ctx.strokeStyle = '#aaa'; ctx.lineWidth = 2 * s; ctx.lineCap = 'round'; ctx.stroke();
      // Arrow on string
      if (isAim) {
        ctx.beginPath(); ctx.moveTo(-pd, 0); ctx.lineTo(bCurve + 22 * s, 0);
        ctx.strokeStyle = '#eee'; ctx.lineWidth = 3 * s; ctx.stroke();
        // Head
        ctx.beginPath(); ctx.moveTo(bCurve + 22 * s, 0); ctx.lineTo(bCurve + 14 * s, -4.5 * s); ctx.lineTo(bCurve + 14 * s, 4.5 * s); ctx.closePath();
        ctx.fillStyle = '#eee'; ctx.fill();
        // Fletching
        ctx.beginPath();
        ctx.moveTo(-pd + 4 * s, -4 * s); ctx.lineTo(-pd, 0); ctx.lineTo(-pd + 4 * s, 4 * s);
        ctx.strokeStyle = C.FLETCH; ctx.lineWidth = 2.5 * s; ctx.stroke();
      }
      ctx.restore();
    }

    function drawStickman(sm) {
      const s = 1.35;
      if (!sm.alive && sm.ragdoll) { drawRagdoll(sm.ragdoll); return; }
      if (!sm.alive) return;
      const j = sm.getJoints();
      const col = C.STK;
      const sv = sm.severed;
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      // Back leg
      if (!sv.has('legB')) {
        ctx.lineWidth = 5.5 * s; ctx.beginPath(); ctx.moveTo(j.hip.x, j.hip.y); ctx.lineTo(j.kneeB.x, j.kneeB.y); ctx.lineTo(j.footB.x, j.footB.y); ctx.stroke();
      } else { drawStump(j.hip.x, j.hip.y); }
      // Back arm
      if (!sv.has('armB')) {
        ctx.strokeStyle = col; ctx.lineWidth = 4.5 * s; ctx.beginPath(); ctx.moveTo(j.shoulder.x, j.shoulder.y); ctx.lineTo(j.elbowB.x, j.elbowB.y); ctx.lineTo(j.handB.x, j.handB.y); ctx.stroke();
      } else { drawStump(j.shoulder.x, j.shoulder.y); }
      // Torso
      ctx.strokeStyle = col; ctx.fillStyle = col;
      drawTorso(j.shoulder.x, j.shoulder.y, j.hip.x, j.hip.y);
      // Head & Neck
      if (!sv.has('head')) {
        ctx.strokeStyle = col; ctx.fillStyle = col;
        ctx.lineWidth = 4 * s; ctx.beginPath(); ctx.moveTo(j.head.x, j.head.y + sm.headR); ctx.lineTo(j.shoulder.x, j.shoulder.y); ctx.stroke();
        ctx.beginPath(); ctx.arc(j.head.x, j.head.y, sm.headR, 0, 6.28); ctx.fill();
        drawHelmet(j.head.x, j.head.y, 0, sm.helmetType, sm.headR);
      } else { drawStump(j.shoulder.x, j.shoulder.y - 4 * s); }
      // Front leg
      if (!sv.has('legF')) {
        ctx.strokeStyle = col; ctx.fillStyle = col;
        ctx.lineWidth = 6.5 * s; ctx.beginPath(); ctx.moveTo(j.hip.x, j.hip.y); ctx.lineTo(j.kneeF.x, j.kneeF.y); ctx.lineTo(j.footF.x, j.footF.y); ctx.stroke();
      } else { drawStump(j.hip.x, j.hip.y); }
      // Front arm + Bow
      if (!sv.has('armF')) {
        ctx.strokeStyle = col; ctx.fillStyle = col;
        ctx.lineWidth = 5.5 * s; ctx.beginPath(); ctx.moveTo(j.shoulder.x, j.shoulder.y); ctx.lineTo(j.elbowF.x, j.elbowF.y); ctx.lineTo(j.handF.x, j.handF.y); ctx.stroke();
        drawBow(j.handF.x, j.handF.y, sm.aimA, sm.isAim, sm.aimPow);
      } else { drawStump(j.shoulder.x, j.shoulder.y); }
      // Joints (only unsevered)
      ctx.fillStyle = col;
      for (const [pt, grp] of [[j.shoulder, null], [j.hip, null], [j.elbowF, 'armF'], [j.elbowB, 'armB'], [j.kneeF, 'legF'], [j.kneeB, 'legB']]) {
        if (!grp || !sv.has(grp)) { ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.5 * s, 0, 6.28); ctx.fill(); }
      }
      // Bow on body if arm severed (can't aim)
      if (sv.has('armF') && !sv.has('armB')) {
        drawBow(j.handB.x, j.handB.y, sm.aimA, sm.isAim, sm.aimPow);
      }
      // Power ring (when aiming)
      if (sm.isAim && !sv.has('head')) {
        ctx.beginPath();
        ctx.arc(j.head.x, j.head.y, 20 * s, -Math.PI / 2, -Math.PI / 2 + 6.28 * sm.aimPow);
        ctx.strokeStyle = sm.aimPow < 0.3 ? '#2ecc71' : sm.aimPow < 0.7 ? '#f1c40f' : '#e74c3c';
        ctx.lineWidth = 2.5 * s; ctx.lineCap = 'round'; ctx.stroke();
      }
    }

    function drawRagdoll(rd) {
      const s = 1.35;
      const p = rd.pts; const col = C.STK; const sv = rd.severed;
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineCap = 'round';
      const line = (a, b, w) => {
        if (!p[a] || !p[b]) return;
        ctx.lineWidth = w * s; ctx.beginPath(); ctx.moveTo(p[a].x, p[a].y); ctx.lineTo(p[b].x, p[b].y); ctx.stroke();
      };
      if (!sv.has('legB')) { line('hip', 'kneeB', 5.5); line('kneeB', 'footB', 5.5); } else { drawStump(p.hip.x, p.hip.y); }
      if (!sv.has('armB')) { line('shoulder', 'elbowB', 4.5); line('elbowB', 'handB', 4.5); } else { drawStump(p.shoulder.x, p.shoulder.y); }
      if (p['shoulder'] && p['hip']) drawTorso(p.shoulder.x, p.shoulder.y, p.hip.x, p.hip.y);
      if (!sv.has('head')) {
        line('head', 'shoulder', 4);
        if (p.head) {
          ctx.beginPath(); ctx.arc(p.head.x, p.head.y, rd.headR, 0, 6.28); ctx.fill();
          const ha = Math.atan2(p.head.y - p.shoulder.y, p.head.x - p.shoulder.x) + Math.PI / 2;
          drawHelmet(p.head.x, p.head.y, ha, rd.helmetType, rd.headR);
        }
      } else { drawStump(p.shoulder.x, p.shoulder.y - 4 * s); }
      if (!sv.has('legF')) { line('hip', 'kneeF', 6.5); line('kneeF', 'footF', 6.5); } else { drawStump(p.hip.x, p.hip.y); }
      if (!sv.has('armF')) { line('shoulder', 'elbowF', 5.5); line('elbowF', 'handF', 5.5); } else { drawStump(p.shoulder.x, p.shoulder.y); }
    }

    function drawArrow(arr) {
      const s = 1.35;
      ctx.save();
      ctx.translate(arr.x, arr.y); ctx.rotate(arr.angle);
      const hl = 22 * s;
      
      // Shaft
      ctx.beginPath(); ctx.moveTo(-hl, 0); ctx.lineTo(hl, 0);
      ctx.strokeStyle = '#eee'; ctx.lineWidth = 3 * s; ctx.lineCap = 'round'; ctx.stroke();
      
      // Head
      ctx.beginPath(); ctx.moveTo(hl + 3 * s, 0); ctx.lineTo(hl - 6 * s, -4.5 * s); ctx.lineTo(hl - 6 * s, 4.5 * s); ctx.closePath();
      ctx.fillStyle = '#ddd'; ctx.fill();
      
      // Fletching
      ctx.beginPath();
      ctx.moveTo(-hl + 4 * s, -4 * s); ctx.lineTo(-hl, 0); ctx.lineTo(-hl + 4 * s, 4 * s);
      ctx.strokeStyle = C.FLETCH; ctx.lineWidth = 2.5 * s; ctx.stroke();
      ctx.restore();
    }

    function drawApple(ap) {
      ctx.beginPath(); ctx.arc(ap.x, ap.y, ap.r, 0, 6.28);
      ctx.fillStyle = '#c0392b'; ctx.fill();
      ctx.beginPath(); ctx.arc(ap.x - 2, ap.y - 3, 3.5, 0, 6.28);
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();
      // Stem
      ctx.beginPath(); ctx.moveTo(ap.x, ap.y - ap.r); ctx.lineTo(ap.x + 1.5, ap.y - ap.r - 5);
      ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 1.8; ctx.stroke();
      // Leaf
      ctx.save(); ctx.translate(ap.x + 4, ap.y - ap.r - 3); ctx.rotate(0.4);
      ctx.beginPath(); ctx.ellipse(0, 0, 5, 2.5, 0, 0, 6.28);
      ctx.fillStyle = '#27ae60'; ctx.fill(); ctx.restore();
    }

    function drawTrajectory(sm) {
      const j = sm.getJoints();
      let x = j.handF.x, y = j.handF.y;
      let vx = Math.cos(sm.aimA) * sm.aimPow * C.ARR_MAX_V;
      let vy = Math.sin(sm.aimA) * sm.aimPow * C.ARR_MAX_V;
      for (let i = 0; i < 55; i++) {
        x += vx; y += vy; vy += C.ARR_GRAV;
        if (x < 0 || x > C.W || y > C.H) break;
        let hitPlat = false;
        for (const p of [leftPlat, rightPlat]) { if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) { hitPlat = true; break; } }
        if (hitPlat) break;
        if (i % 3 === 0) {
          const al = 1 - i / 55;
          ctx.beginPath(); ctx.arc(x, y, 2, 0, 6.28);
          ctx.fillStyle = `rgba(255,255,255,${al * 0.35})`; ctx.fill();
        }
      }
    }

    function drawHUD() {
      // Skull + kills top-left
      ctx.save();
      // Skull icon
      ctx.fillStyle = '#ddd';
      ctx.beginPath(); ctx.arc(30, 26, 9, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(30, 30, 7, 0, Math.PI); ctx.fill();
      ctx.fillStyle = C.BG;
      ctx.beginPath(); ctx.arc(27, 24, 2.5, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(33, 24, 2.5, 0, 6.28); ctx.fill();
      ctx.fillStyle = C.BG;
      [26, 30, 34].forEach(bx => { ctx.fillRect(bx - 0.8, 32, 1.6, 3); });
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(scores[myIdx], 48, 32);
      // Score top-right
      ctx.textAlign = 'right'; ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#888';
      ctx.fillText('SCORE', C.W - 18, 18);
      ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText(scores[0] + ' / ' + scores[1], C.W - 18, 38);
      ctx.restore();
    }

    // ===== GAME LOGIC =====
    function update() {
      if (paused) return;
      // Players
      for (const p of players) if (p) p.update();
      // Arrows
      for (const a of arrows) {
        a.update();
        if (!a.stuck && !a.hasHit) {
          const tgt = players[a.shooterIdx === 0 ? 1 : 0];
          if (tgt && tgt.alive) {
            const hit = checkHit(a, tgt);
            if (hit) handleHit(a, tgt, hit, a.shooterIdx === 0 ? 1 : 0);
          }
          // Apple collision
          if (apple && apple.alive && !a.stuck) {
            if (dist(a.x, a.y, apple.x, apple.y) < apple.r + 6) {
              const shooter = players[a.shooterIdx];
              if (shooter && shooter.alive) {
                shooter.hp = Math.min(C.MAX_HP, shooter.hp + 20);
                spawnHeal(apple.x, apple.y);
              }
              apple.alive = false;
              appleRespawn = 300;
              a.alive = false;
            }
          }
        }
      }
      arrows = arrows.filter(a => a.alive);
      // Apple
      if (apple && apple.alive) apple.update();
      if (!apple || !apple.alive) {
        if (appleRespawn > 0) { appleRespawn--; if (appleRespawn <= 0) apple = new Apple(); }
      }
      // Particles
      for (const p of particles) p.update();
      particles = particles.filter(p => p.alive);
      // Severed parts
      for (const sp of severedParts) sp.update();
      severedParts = severedParts.filter(sp => sp.alive);
      // Ambient particles
      ambientTick++;
      if (ambientTick % 40 === 0) {
        particles.push(new Particle(rand(0, C.W), rand(0, C.H), rand(-0.2, 0.2), rand(-0.15, 0.15), '#555', rand(1, 2.5), rand(80, 180)));
      }
      // Bot
      if (isBotGame) updateBot();
      // Aim sync
      if (ws && ws.readyState === WebSocket.OPEN && players[myIdx]) {
        aimSyncTick++;
        if (aimSyncTick % 3 === 0) {
          const p = players[myIdx];
          netSend({ t: 'aim', a: p.aimA, g: p.isAim ? 1 : 0, p: p.aimPow, x: p.x, cr: p.crouch ? 1 : 0 });
        }
      }
      // Shake
      if (shake > 0.3) shake *= 0.88; else shake = 0;
      // Round over check
      checkRoundOver();
    }

    function handleHit(arr, tgt, hit, tgtIdx) {
      // Arrow bounces off instead of sticking
      arr.stuck = false;
      arr.hasHit = true;
      arr.vx = -arr.vx * 0.15 + rand(-1, 1);
      arr.vy = -Math.abs(arr.vy) * 0.15 - rand(1, 3);
      
      const arrPow = (arr.damage - C.ARR_DMG_MIN) / (C.ARR_DMG_MAX - C.ARR_DMG_MIN);
      let baseDmg = 40 + (arrPow * 80); // Scales 40 to 120
      if (arr.type === 2) baseDmg *= 1.6; // Blade arrow bonus
      
      let dmgMult = 1.0;
      switch(hit.joint) {
        case 'head': dmgMult = 0.80; break;
        case 'shoulder': dmgMult = 0.60; break; // Torso/Neck
        case 'hip': dmgMult = 0.40; break; // Pelvis
        case 'kneeF': case 'kneeB': dmgMult = 0.25; break; // Thigh
        case 'footF': case 'footB': dmgMult = 0.20; break; // Lower Leg
        case 'elbowF': case 'elbowB': dmgMult = 0.20; break; // Upper Arm
        case 'handF': case 'handB': dmgMult = 0.15; break; // Lower Arm
      }
      
      let dmg = Math.round(baseDmg * dmgMult);
      
      // Headshot Logic: Exactly 50 damage, no instant kill unless HP drops to 0
      if (hit.joint === 'head') {
        dmg = 50;
        tgt.stun = 40;
        shake = Math.max(shake, 10);
        hsFlash = Math.max(hsFlash, 10);
        
        if (tgt.hp - dmg <= 0 && tgt.alive) {
          tgt.hp = 0;
          spawnDeathBlood(hit.x, hit.y);
          severLimb(tgt, 'head', arr.vx, arr.vy, hit.x, hit.y);
          if (tgtIdx !== myIdx) netSend({t: 'death', vx: arr.vx, vy: arr.vy});
          return;
        }
      }
      
      // Hit Reactions
      if (['elbowF','elbowB','handF','handB'].includes(hit.joint)) {
        tgt.flinch = 20;
      } else if (['kneeF','kneeB','footF','footB'].includes(hit.joint)) {
        tgt.slow = 80;
      } else if (['shoulder','hip'].includes(hit.joint)) {
        tgt.stagger(arr.vx);
      }

      tgt.hp -= dmg;
      tgt.hp = Math.max(0, tgt.hp);
      
      // Blood spray
      spawnBlood(hit.x, hit.y, arr.vx, arr.vy, hit.headshot ? 16 : 10, hit.headshot);
      spawnHit(hit.x, hit.y);
      if (hit.headshot) hsFlash = Math.max(hsFlash, 8);

      // Fire Arrow Effect
      if (arr.type === 1) tgt.burnT = 180; // 3 seconds of burn

      // Dismemberment for other limbs
      const limbGroup = LIMB_MAP[hit.joint];
      if (limbGroup && limbGroup !== 'head' && arrPow > 0.3 && tgt.alive) {
        if (!tgt.limbHp) tgt.limbHp = { armF: 3, armB: 3, legF: 3, legB: 3 };
        
        // Strong hits deal 2 limb damage, weak hits deal 1 limb damage
        const limbDmg = arrPow > 0.75 ? 2 : 1;
        tgt.limbHp[limbGroup] -= limbDmg;
        
        if (tgt.limbHp[limbGroup] <= 0) {
          severLimb(tgt, limbGroup, arr.vx, arr.vy, hit.x, hit.y);
          shake = Math.max(shake, 12);
        }
      }
      if (tgt.hp <= 0 && tgt.alive) {
        spawnDeathBlood(hit.x, hit.y);
        tgt.die(arr.vx, arr.vy);
        if (tgt.idx !== myIdx) {
          // If my arrow killed them, explicitly tell them to die just in case physics desynced!
          netSend({t: 'death', vx: arr.vx, vy: arr.vy});
        }
      }
    }

    function drawStump(x, y) {
      const s = 1.35;
      ctx.beginPath(); ctx.arc(x, y, 4 * s, 0, 6.28);
      ctx.fillStyle = '#8b0000'; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, 2.5 * s, 0, 6.28);
      ctx.fillStyle = '#a31515'; ctx.fill();
    }

    function checkRoundOver() {
      const d0 = players[0] && !players[0].alive;
      const d1 = players[1] && !players[1].alive;
      if (!d0 && !d1) { roundTimer = 0; return; }
      if (roundTimer === 0) roundTimer = 130;
      roundTimer--;
      if (roundTimer <= 0) {
        gameState = 'roundOver';
        if (d0 && d1) showRoundOver('Draw!');
        else if (d0) { scores[1]++; showRoundOver(isBotGame ? 'Bot Wins!' : myIdx === 0 ? 'You Lose!' : 'You Win!'); }
        else { scores[0]++; showRoundOver(isBotGame ? 'You Win!' : myIdx === 0 ? 'You Win!' : 'You Lose!'); }
      }
    }

    // ===== BOT AI =====
    function calcBotAngle(sx, sy, tx, ty, power) {
      const speed = power * C.ARR_MAX_V;
      const baseAngle = Math.atan2(ty - sy, tx - sx);
      let bestAngle = baseAngle, bestDist = Infinity;
      // Simulate multiple angles to find the one that gets closest
      for (let off = -0.7; off <= 0.3; off += 0.04) {
        const angle = baseAngle + off;
        let x = sx, y = sy;
        let vx = Math.cos(angle) * speed, vy = Math.sin(angle) * speed;
        for (let t = 0; t < 120; t++) {
          x += vx; y += vy; vy += C.ARR_GRAV;
          if (y > C.H || x < -50 || x > C.W + 50) break;
          const d = dist(x, y, tx, ty);
          if (d < bestDist) { bestDist = d; bestAngle = angle; }
        }
      }
      return bestAngle;
    }

    function updateBot() {
      const bot = players[1], plr = players[0];
      if (!bot || !bot.alive || !plr || !plr.alive) return;
      const bj = bot.getJoints(), pj = plr.getJoints();

      // Decide to start aiming (8% chance per frame = shoots much faster)
      if (!bot.isAim && bot.cd <= 0 && bot.st >= C.SHOOT_COST) {
        if (Math.random() < 0.08) {
          bot.isAim = true;
          bot.aimPow = 0;
          bot._targetPow = 0.7 + Math.random() * 0.3; // Full power shots
          bot._targetHead = Math.random() > 0.4; // 60% chance for headshots!
        }
      }

      // If aiming, actively track the target with physics prediction
      if (bot.isAim) {
        const tgtX = bot._targetHead ? pj.head.x : pj.shoulder.x;
        const tgtY = bot._targetHead ? pj.head.y : pj.shoulder.y;
        
        // Lead the target based on their movement speed
        const predictX = tgtX + (plr.vx || 0) * 18;
        const predictY = tgtY + (plr.vy || 0) * 12;

        const idealAngle = calcBotAngle(bj.handF.x, bj.handF.y, predictX, predictY, bot._targetPow);
        if (bot.aimA === undefined) bot.aimA = idealAngle;
        bot.aimA = lerpAngle(bot.aimA, idealAngle, 0.4); // Smooth, fast tracking
      }

      // Release arrow when power reaches target
      if (bot.isAim && bot.aimPow >= bot._targetPow) {
        const j2 = bot.getJoints();
        const a = new Arrow(j2.handF.x, j2.handF.y, bot.aimA, bot.aimPow, 1, 0);
        arrows.push(a);
        bot.st -= C.SHOOT_COST;
        bot.cd = C.SHOOT_CD + randInt(0, 10); // Shorter cooldown
        bot.isAim = false;
        bot.aimPow = 0;
      }

      // Brutal Dodging: Jump over incoming arrows!
      if (bot.onGround && bot.st >= C.JUMP_COST && !bot.fallen) {
        let incoming = false;
        for (const a of arrows) {
          if (a.shooterIdx === 0 && Math.abs(a.x - bot.x) < 160 && Math.abs(a.y - bot.y) < 80 && a.vx > 0) {
            incoming = true;
          }
        }
        if (incoming && Math.random() < 0.1) bot.jump(); // 10% chance to dodge per frame!
        else if (Math.random() < 0.005) bot.jump(); // Very rare random jumps
      }
    }

    // ===== NETWORKING (WebSocket) =====
    function netSend(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        try { ws.send(JSON.stringify({ type: 'game', data: obj })); } catch (e) { }
      }
    }

    function netRecv(data) {
      try {
        const m = typeof data === 'string' ? JSON.parse(data) : data;
        switch (m.t) {
          case 'shoot': {
            const opp = players[1 - myIdx];
            if (opp) {
              const a = new Arrow(m.x, m.y, m.a, m.p, 1 - myIdx, 0);
              arrows.push(a);
              opp.cd = C.SHOOT_CD; opp.isAim = false; opp.aimPow = 0;
            }
            break;
          }
          case 'jump': {
            const opp = players[1 - myIdx];
            if (opp && opp.alive && opp.onGround) opp.jump();
            break;
          }
          case 'aim': {
            const opp = players[1 - myIdx];
            if (opp) {
              opp.aimA = m.a; opp.isAim = !!m.g; opp.aimPow = m.p;
              if (m.x !== undefined) opp.x = m.x;
              if (m.cr !== undefined) opp.crouch = m.cr === 1;
            }
            break;
          }
          case 'death': {
            const opp = players[1 - myIdx];
            if (opp && opp.alive) {
              opp.hp = 0;
              spawnDeathBlood(opp.x, opp.y);
              opp.die(m.vx, m.vy);
            }
            break;
          }
          case 'restart': startRound(m.s); break;
        }
      } catch (e) { }
    }

    function wsConnect(onReady) {
      wsClose();
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${proto}//${location.host}`;
      console.log('[NET] Connecting to', url);
      ws = new WebSocket(url);
      ws.onopen = () => {
        console.log('[NET] WebSocket connected');
        if (onReady) onReady();
      };
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          switch (msg.type) {
            case 'created':
              document.getElementById('lobbyStat').innerHTML =
                'Waiting for friend to join<span class="wt"></span>';
              break;
            case 'joined':
              toast('Connected! Starting game...');
              setTimeout(() => startGame(), 600);
              break;
            case 'peer_joined':
              toast('Friend joined! Starting game...');
              setTimeout(() => startGame(), 600);
              break;
            case 'peer_left':
              if (gameState === 'playing' || gameState === 'roundOver') {
                toast('Opponent disconnected');
                setTimeout(() => G.backMenu(), 2000);
              }
              break;
            case 'start':
              scores = [0, 0];
              showScr(null);
              if (isHost) startRound();
              break;
            case 'game':
              netRecv(msg.data);
              break;
            case 'error':
              toast(msg.msg || 'Connection error');
              const el = document.getElementById('joinStat');
              if (el) { el.textContent = msg.msg; el.className = 'stat err'; }
              break;
          }
        } catch (err) { console.error('[NET]', err); }
      };
      ws.onclose = () => {
        console.log('[NET] WebSocket closed');
        if (gameState === 'playing') { toast('Connection lost!'); setTimeout(() => G.backMenu(), 2000); }
      };
      ws.onerror = (e) => console.error('[NET] WebSocket error', e);
    }

    function wsClose() {
      if (ws) { try { ws.close(); } catch (e) { } ws = null; }
    }

    // ===== INPUT =====
    function toVirtual(ex, ey) {
      const r = cv.getBoundingClientRect();
      return [(ex - r.left) / scale, (ey - r.top) / scale];
    }

    function onMove(ex, ey) {
      [mouseVX, mouseVY] = toVirtual(ex, ey);
      const p = players[myIdx];
      if (p && p.alive) {
        const j = p.getJoints();
        p.aimA = Math.atan2(mouseVY - j.shoulder.y, mouseVX - j.shoulder.x);
      }
    }
    function onDown(ex, ey) {
      if (gameState !== 'playing') return;
      onMove(ex, ey);
      mouseDown = true;
      const p = players[myIdx];
      if (p && p.alive && p.cd <= 0 && p.st >= C.SHOOT_COST) {
        p.isAim = true; p.aimPow = 0;
      }
    }
    function onUp() {
      mouseDown = false;
      const p = players[myIdx];
      if (!p || !p.isAim) return;
      // Fire — enforce minimum power so quick clicks still work
      const j = p.getJoints();
      const pow = Math.max(0.2, p.aimPow);
      const a = new Arrow(j.handF.x, j.handF.y, p.aimA, pow, myIdx, 0);
      arrows.push(a);
      
      p.st -= C.SHOOT_COST; p.cd = C.SHOOT_CD;
      p.isAim = false; p.aimPow = 0;
      
      // Force normal arrow type always
      const shotType = 0;
      p.arrowType = 0;
      
      // Send to opponent
      netSend({ t: 'shoot', a: p.aimA, p: pow, x: j.handF.x, y: j.handF.y, type: shotType });
    }

    // ===== RENDER LOOP =====
    function render() {
      ctx.save();
      // Shake
      if (shake > 0.4) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }
      ctx.scale(scale, scale);
      // BG
      ctx.fillStyle = C.BG; ctx.fillRect(0, 0, C.W, C.H);
      drawStars();
      // Blood stains (under everything)
      drawBloodStains();
      // Platforms
      drawPlatform(leftPlat, 0); drawPlatform(rightPlat, 1);
      // Apple
      if (apple && apple.alive) drawApple(apple);
      // Players
      for (let i = 0; i < 2; i++) if (players[i]) drawStickman(players[i]);
      // Arrows
      for (const a of arrows) drawArrow(a);
      // Severed parts
      for (const sp of severedParts) sp.draw();
      // Trajectory
      const me = players[myIdx];
      if (me && me.isAim && me.alive) drawTrajectory(me);
      // Particles
      for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.28);
        ctx.fillStyle = p.color; ctx.fill();
      }
      ctx.globalAlpha = 1;
      // Headshot flash
      if (hsFlash > 0) {
        ctx.globalAlpha = hsFlash / 12 * 0.25;
        ctx.fillStyle = '#e74c3c'; ctx.fillRect(0, 0, C.W, C.H);
        ctx.globalAlpha = 1;
        hsFlash--;
      }
      // HUD
      if (gameState === 'playing' || gameState === 'roundOver') drawHUD();
      ctx.restore();
    }

    let lastTime = 0;
    let accumulator = 0;
    const TIME_STEP = 1000 / 60; // 60 fps fixed update

    function loop(time) {
      if (!lastTime) lastTime = time;
      let dt = time - lastTime;
      lastTime = time;
      if (dt > 100) dt = 100; // prevent spiral of death

      accumulator += dt;
      while (accumulator >= TIME_STEP) {
        if (gameState === 'playing') update();
        accumulator -= TIME_STEP;
      }

      render();
      requestAnimationFrame(loop);
    }

    // ===== SCREEN MANAGEMENT =====
    function showScr(id) {
      ['menuScr', 'lobbyScr', 'joinScr', 'goScr'].forEach(s => {
        document.getElementById(s).classList.toggle('hidden', s !== id);
      });
    }

    function showRoundOver(txt) {
      document.getElementById('winTxt').textContent = txt;
      document.getElementById('scoreTxt').textContent = scores[0] + ' - ' + scores[1];
      showScr('goScr');
      document.getElementById('jumpBtn').style.display = 'none';
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function startRound(s) {
      if (!s) {
        if (!isBotGame && ws && ws.readyState === WebSocket.OPEN && !isHost) {
          // Client waits for the host to send the seed
          return;
        }
        s = {
          w0: 100 + Math.random() * 30, w1: 100 + Math.random() * 30,
          y0: rand(280, 480), y1: rand(280, 480),
          x0: rand(5, 40), x1: C.W - rand(5, 40),
          h0: randInt(1, 4), h1: randInt(1, 4)
        };
        if (ws && ws.readyState === WebSocket.OPEN) {
          netSend({ t: 'restart', s: s });
        }
      }

      leftPlat = { x: s.x0, y: s.y0, w: s.w0, h: C.H - s.y0 + 20 };
      rightPlat = { x: s.x1 - s.w1, y: s.y1, w: s.w1, h: C.H - s.y1 + 20 };
      const pl0 = leftPlat, pl1 = rightPlat;
      players[0] = new Stickman(pl0.x + pl0.w / 2, pl0.y, 1, 0);
      players[1] = new Stickman(pl1.x + pl1.w / 2, pl1.y, -1, 1);
      players[0].helmetType = s.h0;
      players[1].helmetType = s.h1;
      
      arrows = []; particles = []; roundTimer = 0; shake = 0; hsFlash = 0;
      bloodStains = []; severedParts = []; apple = new Apple(); appleRespawn = 0;
      gameState = 'playing';
      showScr(null);
      document.getElementById('jumpBtn').style.display = 'block';
      document.getElementById('pauseBtn').style.display = 'block';
    }

    function startGame() {
      showScr(null);
      startRound();
    }

    // ===== GAME CONTROLLER =====
    const G = {
      createRoom() {
        roomCode = genCode();
        showScr('lobbyScr');
        document.getElementById('roomCode').textContent = roomCode;
        document.getElementById('lobbyStat').innerHTML = '<span class="wt">Connecting to server</span>';
        isHost = true; isBotGame = false; myIdx = 0;
        wsConnect(() => {
          ws.send(JSON.stringify({ type: 'create', code: roomCode }));
        });
      },
      showJoin() {
        showScr('joinScr');
        document.getElementById('joinInp').value = '';
        document.getElementById('joinStat').textContent = '';
        setTimeout(() => document.getElementById('joinInp').focus(), 100);
      },
      joinRoom() {
        const code = document.getElementById('joinInp').value.trim().toUpperCase();
        if (code.length !== 5) {
          document.getElementById('joinStat').textContent = 'Enter a 5-character code';
          document.getElementById('joinStat').className = 'stat err';
          return;
        }
        document.getElementById('joinStat').innerHTML = '<span class="wt">Connecting</span>';
        document.getElementById('joinStat').className = 'stat';
        isHost = false; isBotGame = false; myIdx = 1; roomCode = code;
        wsConnect(() => {
          document.getElementById('joinStat').innerHTML = '<span class="wt">Joining room ' + code + '</span>';
          ws.send(JSON.stringify({ type: 'join', code: roomCode }));
        });
      },
      startBot() {
        isBotGame = true; isHost = true; myIdx = 0;
        scores = [0, 0];
        startGame();
      },
      copyCode() {
        navigator.clipboard.writeText(roomCode).then(() => toast('Code copied!')).catch(() => { });
      },
      cancel() {
        wsClose();
        G.showMenu();
      },
      showMenu() {
        gameState = 'menu';
        showScr('menuScr');
        document.getElementById('jumpBtn').style.display = 'none';
        document.getElementById('pauseBtn').style.display = 'none';
      },
      nextRound() {
        startRound();
        netSend({ t: 'restart' });
      },
      backMenu() {
        wsClose();
        scores = [0, 0];
        G.showMenu();
      },
      doJump() {
        const p = players[myIdx];
        if (p && p.jump()) {
          netSend({ t: 'jump' });
        }
      },
      togglePause() {
        paused = !paused;
        document.getElementById('pauseBtn').textContent = paused ? '▶' : '⏸';
      },
    };

    // ===== RESIZE =====
    function resize() {
      const asp = C.W / C.H;
      let w = window.innerWidth, h = window.innerHeight;
      if (w / h > asp) w = h * asp; else h = w / asp;
      cv.width = w; cv.height = h;
      cv.style.width = w + 'px'; cv.style.height = h + 'px';
      scale = w / C.W;
    }

    // ===== INIT =====
    function init() {
      cv = document.getElementById('cv');
      ctx = cv.getContext('2d');
      resize(); genStars();

      // Mouse events
      cv.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
      cv.addEventListener('mousedown', e => { e.preventDefault(); onDown(e.clientX, e.clientY); });
      window.addEventListener('mouseup', () => onUp());

      // Touch events
      cv.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: false });
      cv.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; onDown(t.clientX, t.clientY); }, { passive: false });
      window.addEventListener('touchend', () => onUp());

      // Keyboard
      window.addEventListener('keydown', e => {
        if (e.code === 'Space' && gameState === 'playing') { e.preventDefault(); G.doJump(); }
        if (e.code === 'Escape') G.backMenu();
      });

      // Join input enter key
      document.getElementById('joinInp').addEventListener('keydown', e => {
        if (e.key === 'Enter') G.joinRoom();
      });

      window.addEventListener('resize', resize);

      requestAnimationFrame(loop);
    }

    window.onload = init;
  </script>
</body>

</html>
